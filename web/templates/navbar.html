<div style="background: khaki;" class="container">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link" href="{% url 'promociones' %}">
               Promociones
            </a>
           </li>

          <li class="nav-item">
            <a class="nav-link active" href="{% url 'indice' %}">
              Inicio
            </a>
          </li>

         {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'bienvenido' %}">
              Bienvenido
            </a>
          </li>
          {% endif %}

          <li class="nav-item">
            <a class="nav-link" href="{% url 'acerca' %}">
              Acerca
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{% url 'contacto' %}">
              Contacto
            </a>
          </li>

        </ul>

        <ul class="navbar-nav ms-auto">

          {% if user.is_authenticated %}

            <li class="nav-item d-flex align-items-center me-3">
              <span class="navbar-text">
                Hola, <strong>{{ user.username }}</strong>
              </span>
            </li>

            <li class="nav-item">
              <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-secondary">
                  Cerrar sesión
                </button>
              </form>
            </li>

          {% else %}

            <li class="nav-item">
              <a class="btn btn-secondary" href="{% url 'login' %}">
                Iniciar sesión
              </a>
            </li>

          {% endif %}

        </ul>

      </div>
    </div>
  </nav>
</div>
