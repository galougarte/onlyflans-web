{% extends 'base.html' %}
{% block content %}
<div class="container">

  <div class="alert alert-success" role="alert">
    <h2>Bienvenido {{ user.get_username }}</h2>
  </div>

  <div class="row mt-4 mb-4">
    {% for flan in private_flans %}
    <div class="col-6 col-md-3">
      <div class="card mb-4">
        <img src="{{ flan.image_url }}" class="card-img-top" alt="{{ flan.name }}">
        <div class="card-body">
          <h5 class="card-title">{{ flan.name }}</h5>
          <p class="card-text">{{ flan.description }}</p>
          <p class="card-text fw-bold">${{ flan.price }}</p>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
